# Lantern Forms – build and deploy
#
# push to main  -> build both images, deploy to dev, smoke test
#               -> wait for approval on the "prod" environment, then deploy the same images to prod
#
# Auth is OIDC against the user-assigned managed identity id-forms-deploy (no stored secrets).
# Per-environment values live in GitHub environment *variables* (Settings -> Environments):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, RG, BACKEND_URL, WEB_HOST
#
# Migrations: only the api app reaches the database (private endpoint), so they run there.
# The deploy job sets RUN_MIGRATIONS=then-start (the container runs `prisma migrate deploy`,
# then starts the API, or exits if the migration fails), deploys the new image, and waits for
# /api/health/deploy to report the new commit AND the newest migration in this commit. Only
# then is the flag cleared. A bare 200 from /api/health proves nothing: the old container
# keeps answering while the new one starts (that's how 2026-10-21 shipped unmigrated).
# If the wait fails, the api goes back to the image it had and the job fails.

name: cd-forms

on:
  push:
    branches: [main]
  # No pull_request trigger: the build job runs in the "dev" environment, whose
  # protection rules only admit main, so a PR run is always rejected (and it would
  # push images to ACR). ci.yml is the PR build check.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR: acrlcsforms.azurecr.io

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev            # build once with dev's deploy identity; images are env-agnostic except BACKEND_URL
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      migration: ${{ steps.meta.outputs.migration }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          # The newest migration this commit ships; the deploy waits until the database has it.
          migration=$(find backend/prisma/migrations -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tail -n 1)
          [ -n "$migration" ] || { echo "::error::no migrations found in backend/prisma/migrations"; exit 1; }
          echo "migration=$migration" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - run: az acr login --name acrlcsforms

      - name: Build and push api image
        run: |
          docker build --build-arg GIT_SHA=${{ steps.meta.outputs.tag }} --build-arg BUILD_NUMBER=${{ github.run_number }} \
            -t $ACR/lcs-forms-api:${{ steps.meta.outputs.tag }} backend
          docker push $ACR/lcs-forms-api:${{ steps.meta.outputs.tag }}

      # BACKEND_URL is baked into the frontend at build time, so one web image per environment.
      # If Collin moves BACKEND_URL to a runtime rewrite, drop the -prod build and reuse one tag.
      - name: Build and push web images (dev + prod)
        run: |
          docker build --build-arg GIT_SHA=${{ steps.meta.outputs.tag }} --build-arg BUILD_NUMBER=${{ github.run_number }} --build-arg BACKEND_URL=${{ vars.BACKEND_URL }} \
            -t $ACR/lcs-forms-web:${{ steps.meta.outputs.tag }}-dev frontend
          docker build --build-arg GIT_SHA=${{ steps.meta.outputs.tag }} --build-arg BUILD_NUMBER=${{ github.run_number }} --build-arg BACKEND_URL=https://app-forms-api-prod.azurewebsites.net \
            -t $ACR/lcs-forms-web:${{ steps.meta.outputs.tag }}-prod frontend
          docker push $ACR/lcs-forms-web:${{ steps.meta.outputs.tag }}-dev
          docker push $ACR/lcs-forms-web:${{ steps.meta.outputs.tag }}-prod

  deploy-dev:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Record the api's current image (to go back to if migrations fail)
        id: prev
        run: echo "image=$(az webapp config show -g ${{ vars.RG }} -n app-forms-api-dev --query linuxFxVersion -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Migrate on the next api start
        run: az webapp config appsettings set -g ${{ vars.RG }} -n app-forms-api-dev --settings RUN_MIGRATIONS=then-start -o none

      - uses: azure/webapps-deploy@v3
        with:
          app-name: app-forms-api-dev
          images: ${{ env.ACR }}/lcs-forms-api:${{ needs.build.outputs.tag }}

      - name: Wait for the new api with migrations applied (up to 10 min)
        run: bash .github/scripts/wait-for-api.sh https://${{ vars.WEB_HOST }} ${{ needs.build.outputs.tag }} ${{ needs.build.outputs.migration }} 600

      # The new image never came up migrated: don't leave it set to start (unmigrated) once the
      # flag is cleared below. Put the old image back; the job still fails.
      - name: Roll the api back to its previous image
        if: failure() && steps.prev.outputs.image != ''
        run: az webapp config set -g ${{ vars.RG }} -n app-forms-api-dev --linux-fx-version "${{ steps.prev.outputs.image }}" -o none

      - name: Stop migrating on api start
        if: always()
        run: az webapp config appsettings set -g ${{ vars.RG }} -n app-forms-api-dev --settings RUN_MIGRATIONS=false -o none

      - name: Wait for the api to come back without the flag (up to 5 min)
        run: bash .github/scripts/wait-for-api.sh https://${{ vars.WEB_HOST }} ${{ needs.build.outputs.tag }} ${{ needs.build.outputs.migration }} 300

      - uses: azure/webapps-deploy@v3
        with:
          app-name: app-forms-web-dev
          images: ${{ env.ACR }}/lcs-forms-web:${{ needs.build.outputs.tag }}-dev

      - name: Smoke test (retries for 3 min)
        run: |
          for i in $(seq 1 18); do
            if curl -fsS https://${{ vars.WEB_HOST }}/api/health; then echo; echo "healthy"; exit 0; fi
            sleep 10
          done
          echo "smoke test failed"; exit 1

  deploy-prod:
    needs: [build, deploy-dev]
    if: ${{ github.event_name != 'pull_request' && vars.PROD_READY == 'true' }}
    runs-on: ubuntu-latest
    environment: prod           # required reviewers configured on the environment gate this job
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Record the api's current image (to go back to if migrations fail)
        id: prev
        run: echo "image=$(az webapp config show -g ${{ vars.RG }} -n app-forms-api-prod --query linuxFxVersion -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Migrate on the next api start
        run: az webapp config appsettings set -g ${{ vars.RG }} -n app-forms-api-prod --settings RUN_MIGRATIONS=then-start -o none

      - uses: azure/webapps-deploy@v3
        with:
          app-name: app-forms-api-prod
          images: ${{ env.ACR }}/lcs-forms-api:${{ needs.build.outputs.tag }}

      - name: Wait for the new api with migrations applied (up to 10 min)
        run: bash .github/scripts/wait-for-api.sh https://${{ vars.WEB_HOST }} ${{ needs.build.outputs.tag }} ${{ needs.build.outputs.migration }} 600

      # The new image never came up migrated: don't leave it set to start (unmigrated) once the
      # flag is cleared below. Put the old image back; the job still fails.
      - name: Roll the api back to its previous image
        if: failure() && steps.prev.outputs.image != ''
        run: az webapp config set -g ${{ vars.RG }} -n app-forms-api-prod --linux-fx-version "${{ steps.prev.outputs.image }}" -o none

      - name: Stop migrating on api start
        if: always()
        run: az webapp config appsettings set -g ${{ vars.RG }} -n app-forms-api-prod --settings RUN_MIGRATIONS=false -o none

      - name: Wait for the api to come back without the flag (up to 5 min)
        run: bash .github/scripts/wait-for-api.sh https://${{ vars.WEB_HOST }} ${{ needs.build.outputs.tag }} ${{ needs.build.outputs.migration }} 300

      - uses: azure/webapps-deploy@v3
        with:
          app-name: app-forms-web-prod
          images: ${{ env.ACR }}/lcs-forms-web:${{ needs.build.outputs.tag }}-prod

      - name: Smoke test (retries for 3 min)
        run: |
          for i in $(seq 1 18); do
            if curl -fsS https://${{ vars.WEB_HOST }}/api/health; then echo; echo "healthy"; exit 0; fi
            sleep 10
          done
          echo "smoke test failed"; exit 1
